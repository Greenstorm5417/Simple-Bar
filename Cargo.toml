[package]
name = "simple-bar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal, pixel-exact replacement for a waybar setup on the Mango and dwl Wayland compositors"
readme = "README.md"
keywords = ["wayland", "bar", "statusbar", "mango", "dwl"]
categories = ["gui"]
publish = false

[lib]
name = "simple_bar"
path = "src/lib.rs"

[[bin]]
name = "simple-bar"
path = "src/main.rs"

[[bench]]
name = "bar"
harness = false

[dependencies]
cairo-rs = "0.22.11"
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
dbus = "0.9.12"
libc = "0.2.191"
pango = "0.22.9"
pangocairo = "0.22.9"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-scanner = "0.31.11"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
# Pixel math converts between f64 logical pixels, i32 buffer pixels and u32
# surface sizes throughout; every value is a screen coordinate far inside
# the range where these conversions are exact.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[profile.bench]
# Benchmarks measure the code as shipped, but with symbols for profilers.
inherits = "release"
strip = false
debug = 1
